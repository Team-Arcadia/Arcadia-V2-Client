#Rarity balancing — weights and stat floors.
#Order: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC
[rarities]
	#Roll weight for each rarity. Higher = more common.
	#The weights are relative — e.g. [4500,3000,1500,700,250,50]
	#means COMMON is 4500/(sum) likely when rolling from COMMON floor.
	weights = [4500, 3000, 1500, 700, 250, 50]
	#Minimum stat star per rarity (1–5). Pets cannot roll below this floor.
	#Order: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC
	stat_floors = [1, 1, 2, 2, 3, 4]

#Stat rolling — base weights for each star level.
#Index 0 = 1★, index 4 = 5★. Redistributed upward for rarities with a floor > 1.
[stats]
	#Base probability weights for 1★ through 5★.
	star_weights = [40, 30, 18, 9, 3]
	#Chance for a crate to yield an ARCANE pet instead of its normal roll,
	#in permille. 10 = 1%. Drawn before the ordinary rarity roll and only
	#in crates at or above arcane_min_crate_tier. Range: 0-1000.
	# Default: 10
	# Range: 0 ~ 1000
	arcane_permille = 10
	#Lowest crate tier that can roll an ARCANE pet, as a rarity ordinal
	#(0=COMMON … 4=LEGENDARY, 5=MYTHIC). Default 4 — the Legendary crate,
	#which is the rarest one a player can obtain.
	# Default: 4
	# Range: 0 ~ 6
	arcane_min_crate_tier = 4
	#Whether an equipped pet grants its owner passive stat bonuses.
	#Each gene star gives the player +2% of the matching attribute:
	#  POW → attack damage, END → max health, AGI → movement speed,
	#  WIT → attack speed, LCK → luck.
	#This is why equipping a 5★ Endurance pet visibly adds a heart.
	#Set false to make pets purely cosmetic + skill-driven; existing
	#bonuses are stripped from players as soon as they re-equip.
	passive_player_bonuses = true

#Mob pools — which entity types can appear at each rarity.
#Use namespaced IDs, e.g. "minecraft:fox" or "mymod:custom_mob".
[pools]
	#Mobs rollable at COMMON rarity
	common = ["minecraft:chicken", "minecraft:pig", "minecraft:cow", "minecraft:sheep", "minecraft:rabbit", "minecraft:cat", "minecraft:fox", "minecraft:bee"]
	#Mobs rollable at UNCOMMON rarity
	uncommon = ["minecraft:wolf", "minecraft:axolotl", "minecraft:panda", "minecraft:frog", "minecraft:turtle"]
	#Mobs rollable at RARE rarity
	rare = ["minecraft:allay", "minecraft:sniffer", "minecraft:strider"]
	#Mobs rollable at EPIC rarity
	epic = ["minecraft:iron_golem", "minecraft:enderman", "minecraft:blaze", "minecraft:wither_skeleton"]
	#Mobs rollable at LEGENDARY rarity
	legendary = ["minecraft:warden", "minecraft:ender_dragon", "minecraft:wither", "minecraft:elder_guardian", "minecraft:ravager", "minecraft:breeze", "minecraft:shulker"]
	#Mobs rollable at MYTHIC rarity — Staff member pets (player-skin entities)
	mythic = ["arcadia_prestige:staff_vyrriox", "arcadia_prestige:staff_siriust", "arcadia_prestige:staff_tyvrax", "arcadia_prestige:staff_jlpopeye", "arcadia_prestige:staff_gaspich"]

#Pet Sniffer dig allowlist.
#When a pet sniffer is equipped/active, any server-spawned item that lands within
#1.5 blocks of it is cancelled UNLESS its registry id is in this list. This neutralizes
#the vanilla sniffer_digging dupe path (and any datapack-extended drop tables) while
#still letting players farm a controlled set of basic vanilla ores.
[sniffer]
	#Items the pet sniffer is allowed to drop. Use namespaced item ids.
	#Anything not in this list will be cancelled when it spawns near a pet sniffer.
	dig_allowlist = ["minecraft:coal", "minecraft:raw_iron", "minecraft:raw_gold", "minecraft:raw_copper", "minecraft:diamond", "minecraft:emerald", "minecraft:redstone", "minecraft:lapis_lazuli", "minecraft:quartz", "minecraft:netherite_scrap", "minecraft:coal_ore", "minecraft:deepslate_coal_ore", "minecraft:iron_ore", "minecraft:deepslate_iron_ore", "minecraft:gold_ore", "minecraft:deepslate_gold_ore", "minecraft:nether_gold_ore", "minecraft:diamond_ore", "minecraft:deepslate_diamond_ore", "minecraft:emerald_ore", "minecraft:deepslate_emerald_ore", "minecraft:copper_ore", "minecraft:deepslate_copper_ore", "minecraft:redstone_ore", "minecraft:deepslate_redstone_ore", "minecraft:lapis_ore", "minecraft:deepslate_lapis_ore", "minecraft:nether_quartz_ore", "minecraft:ancient_debris"]
	#Blocks the Sniffer's Ancient Sense skill may duplicate when broken.
	#Kept to cheap, renewable nature blocks (sniffer archaeology loot, flowers,
	#seeds, dirt/sand/gravel, moss, grass) so the skill cannot reproduce the old
	#'dupe anything' exploit. Use namespaced block ids. Anything not listed here
	#is never duplicated, whatever the skill level.
	skill_friendly_blocks = ["minecraft:torchflower", "minecraft:pitcher_plant", "minecraft:torchflower_crop", "minecraft:pitcher_crop", "minecraft:wheat", "minecraft:short_grass", "minecraft:tall_grass", "minecraft:fern", "minecraft:large_fern", "minecraft:dandelion", "minecraft:poppy", "minecraft:blue_orchid", "minecraft:allium", "minecraft:azure_bluet", "minecraft:oxeye_daisy", "minecraft:cornflower", "minecraft:lily_of_the_valley", "minecraft:sunflower", "minecraft:lilac", "minecraft:rose_bush", "minecraft:peony", "minecraft:dirt", "minecraft:coarse_dirt", "minecraft:rooted_dirt", "minecraft:moss_block", "minecraft:moss_carpet", "minecraft:sand", "minecraft:gravel", "minecraft:mud"]

#World drop settings — structure chests and mob kill drops.
#All toggleable at runtime via /arcadia_pets drops and /arcadia_pets mobdrops.
[drops]
	#Whether pet bags can appear in dungeon/structure chests. Default: true.
	chest_drops_enabled = true
	#Whether killing a mob can drop its corresponding pet item. Default: true.
	mob_drops_enabled = true
	#Drop chance for common-tier chests (village, shipwreck, etc.), in permille.
	#25 = 2.5%. Range: 0–1000.
	# Default: 25
	# Range: 0 ~ 1000
	common_chest_permille = 25
	#Drop chance for endgame-tier chests (trial chambers, nether fortress, end city, etc.), in permille.
	#50 = 5%. Range: 0–1000.
	# Default: 50
	# Range: 0 ~ 1000
	endgame_chest_permille = 50
	#Mob kill drop denominator for non-boss mobs.
	#Roll is: random(denominator) < (1 + looting_level). Default 1000 → base 1/1000.
	# Default: 1000
	# Range: 1 ~ 100000
	mob_drop_denominator = 1000
	#Mob kill drop denominator for boss mobs (Warden, Ender Dragon, Wither, Elder Guardian).
	#Roll is: random(denominator) < (1 + looting_level). Default 100 → base 1/100.
	# Default: 100
	# Range: 1 ~ 100000
	boss_drop_denominator = 100
	#Rarity weights for common chest drops. Order: COMMON, UNCOMMON, RARE.
	#Default [75, 20, 5] → RARE at 5% of drops (2.5% chest × 5% = 0.125% overall).
	common_tier_rarity_weights = [75, 20, 5]
	#Rarity weights for endgame chest drops. Order: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY.
	#Default [23, 35, 30, 10, 2] → LEGENDARY at 2% of drops (5% chest × 2% = 0.1% overall).
	endgame_tier_rarity_weights = [23, 35, 30, 10, 2]
	#Chance for pet treats/snacks to appear in common-tier chests, in permille.
	#60 = 6%. On success, 1–2 of a randomly chosen treat or snack. Range: 0–1000.
	# Default: 60
	# Range: 0 ~ 1000
	supplies_common_permille = 60
	#Chance for pet treats/snacks to appear in endgame-tier chests, in permille.
	#100 = 10%. On success, 1–2 of a randomly chosen treat or snack. Range: 0–1000.
	# Default: 100
	# Range: 0 ~ 1000
	supplies_endgame_permille = 100
	#Chance for a Star Essence to appear in common-tier chests, in permille.
	#20 = 2%. Range: 0–1000.
	# Default: 20
	# Range: 0 ~ 1000
	essence_common_permille = 20
	#Chance for a Star Essence to appear in endgame-tier chests, in permille.
	#40 = 4%. Range: 0–1000.
	# Default: 40
	# Range: 0 ~ 1000
	essence_endgame_permille = 40

#Rideable pets. A pet can only be mounted while it exists as a world entity,
#i.e. in Follow mode — pocket pets have no entity to sit on.
#Toggleable at runtime via /arcadia_pets mounts.
[mounts]
	#Send routine pet status to chat instead of the action bar.
	#Off by default: mounting, feeding, hunger, pocket switches and flight
	#warnings all used to land in chat, which players reported as spam.
	#Deaths, milestones and anything with a consequence stay in chat either way.
	verbose_chat = false
	#Whether pets can be ridden at all. Default: true.
	enabled = true
	#Whether FLYING mounts may actually leave the ground.
	#Set false to keep flying species rideable but grounded — useful on
	#servers where free flight would break exploration or claim protection.
	flight_enabled = true
	#Bond a pet must have earned before it can be ridden at all.
	#Bond runs 0-100 and is earned by keeping the pet out with you.
	#ARCANE pets are born at 100 and skip this entirely.
	# Default: 25
	# Range: 0 ~ 100
	bond_ground = 25
	#Bond required before a FLYING mount will leave the ground.
	#Deliberately far above bond_ground: flight trivialises travel, so it
	#is the long goal rather than the first one.
	# Default: 75
	# Range: 0 ~ 100
	bond_flying = 75
	#Blocks travelled together for 1 bond. Only counts while the pet is
	#summoned and following. Lower = faster progress.
	# Default: 100
	# Range: 1 ~ 10000
	bond_blocks_per_point = 100
	#Bond granted per mob killed with the pet out nearby.
	# Default: 2
	# Range: 0 ~ 100
	bond_per_kill = 2
	#Seconds of simply having the pet out for 1 bond. Ticks alongside the
	#travel and kill sources, so a stationary player still progresses slowly.
	# Default: 120
	# Range: 1 ~ 100000
	bond_seconds_per_point = 120
	#Total stars (sum of the 6 genes, 6-30) a pet needs before it can be
	#ridden as a ground/aquatic mount. 0 = no requirement.
	# Default: 0
	# Range: 0 ~ 30
	ground_star_floor = 0
	#Total stars a pet needs before it can be ridden as a FLYING mount.
	#Default 12 — reachable but requires an invested pet.
	# Default: 12
	# Range: 0 ~ 30
	flying_star_floor = 12
	#Base ground mount speed in blocks/tick before the Agility bonus
	#(+8% per AGI star). 0.24 lands just above sprinting at 3 stars.
	# Default: 0.24
	# Range: 0.05 ~ 1.0
	ground_speed = 0.24
	#Base aquatic mount speed in blocks/tick before the Agility bonus.
	# Default: 0.2
	# Range: 0.05 ~ 1.0
	swim_speed = 0.2
	#Base flying mount speed in blocks/tick before the Agility bonus.
	# Default: 0.3
	# Range: 0.05 ~ 1.0
	fly_speed = 0.3
	#Flight stamina pool in seconds at 0 Endurance stars.
	# Default: 30
	# Range: 1 ~ 3600
	flight_base_seconds = 30
	#Extra flight seconds granted per Endurance star.
	#Default 10 → a 5★ END pet flies for 30 + 50 = 80 s per pool.
	# Default: 10
	# Range: 0 ~ 600
	flight_seconds_per_endurance = 10
	#Species rideable as GROUND mounts. Namespaced entity ids.
	ground_species = ["minecraft:pig", "minecraft:cow", "minecraft:mooshroom", "minecraft:sheep", "minecraft:panda", "minecraft:wolf", "minecraft:ravager", "minecraft:iron_golem", "minecraft:sniffer", "minecraft:strider", "minecraft:wither_skeleton", "minecraft:polar_bear", "minecraft:hoglin", "minecraft:zoglin", "minecraft:horse", "minecraft:donkey", "minecraft:mule", "minecraft:camel", "minecraft:llama", "minecraft:warden", "arcadia_pets:izzy_creeper"]
	#Species rideable as AQUATIC mounts. Namespaced entity ids.
	aquatic_species = ["minecraft:turtle", "minecraft:axolotl", "minecraft:dolphin", "minecraft:elder_guardian"]
	#Species rideable as FLYING mounts. Namespaced entity ids.
	#A species listed here overrides its presence in the other two lists.
	flying_species = ["minecraft:bee", "minecraft:allay", "minecraft:blaze", "minecraft:parrot", "minecraft:phantom", "minecraft:ghast", "minecraft:breeze", "arcadia_lib:staff_loldragman", "arcadia_pets:dragon_mount", "arcadia_pets:end_manta_ray", "arcadia_pets:lava_whale"]

#General gameplay toggles.
[gameplay]
	#Whether new players are handed the Pet Collection Book on their first login.
	#The book unlocks the pet advancement tab. Disable this if it conflicts with
	#starter-kit plugins or other mods that hand out first-join items. Players can
	#still craft/obtain the book normally. Default: true.
	starter_book_enabled = true
