#Auction House listing settings.
[listings]
	#How many hours a listing stays active before expiring and returning to the seller's mailbox.
	# Default: 48
	# Range: 1 ~ 336
	listing_duration_hours = 48
	#Maximum number of active listings a single player can have at once.
	# Default: 30
	# Range: 1 ~ 500
	max_listings_per_player = 30
	#Listing fee taken upfront from the seller's balance when creating a listing.
	#Expressed as a percentage of the listing price (10 = 10%).
	#Acts as a money sink and discourages spam listings.
	#Set to 0 to disable the fee entirely.
	# Default: 10
	# Range: 0 ~ 100
	listing_fee_percent = 10
	#Maximum price a single listing (or bid) may be set to.
	#Hard-capped at Integer.MAX_VALUE (2,147,483,647) because the Numismatics
	#currency backend moves coins through an int-bound API: any single coin
	#movement above this would otherwise have to be chunked, and historically
	#was silently truncated, underpaying the seller. Keeping the cap at the
	#int ceiling guarantees every price/bid is moved in a single, exact transfer.
	#Also prevents integer-overflow of the fee math (price * percent).
	#Default 1,000,000,000 (1e9).
	# Default: 1000000000
	# Range: 1 ~ 2147483647
	max_listing_price = 1000000000
	#Tax withheld from the SELLER when a sale completes, as a percentage of
	#the sale price (5 = 5%). Distinct from listing_fee_percent, which is
	#charged upfront whether or not the item ever sells.
	#The buyer always pays exactly the listing price; the tax comes out of
	#what the seller receives, and applies to won auctions as well as
	#instant buys.
	#Default 0 — an existing server keeps paying sellers 100% until an
	#admin opts in.
	# Default: 0
	# Range: 0 ~ 90
	sales_tax_percent = 0

#Item blacklist — items that cannot be listed on the AH.
#Use registry IDs (e.g. 'minecraft:bedrock', 'arcadia_pets:pet_item').
[blacklist]
	#List of item registry IDs that are blocked from being sold.
	items = ["minecraft:bedrock", "minecraft:command_block", "minecraft:barrier"]

#Featured listings — paid promotion that puts a listing at the top of search results.
[featured]
	#Extra fee, on top of the listing fee, taken upfront when a seller upgrades a listing to FEATURED.
	#Expressed as a percentage of the listing price (30 = 30%).
	#Set to 0 to make featuring free (not recommended).
	# Default: 30
	# Range: 0 ~ 500
	featured_fee_percent = 30
	#How many hours a listing remains FEATURED after upgrade (capped at the listing's own expiry).
	# Default: 24
	# Range: 1 ~ 336
	featured_duration_hours = 24

#Global chat broadcast on every new listing.
[broadcast]
	#If true, broadcast a chat message to all online players on every new listing.
	enabled = true
	#Minimum seconds between two broadcasts triggered by the same seller — anti-spam guard.
	# Default: 30
	# Range: 0 ~ 3600
	per_seller_cooldown_seconds = 30
	#Maximum length of a player's personalised broadcast template (characters).
	# Default: 128
	# Range: 16 ~ 512
	max_template_length = 128

#Server-side integrity checks before accepting a listing.
[integrity]
	#If true, every listed item must round-trip through the NBT serializer cleanly.
	#Fixes the cross-server SHULKER BOX BUG where contained items were lost when
	#the item was bought on a different server with a stricter NBT view.
	#Recommended: keep enabled. Disabling restores the legacy permissive behaviour.
	strict_nbt_validation = true

#Per-player sales history command (/arcadia_ah history).
[history]
	#Number of sales returned per page in /arcadia_ah history.
	# Default: 10
	# Range: 1 ~ 50
	page_size = 10
	#Look-back window for /arcadia_ah history, in days. Older sales are not shown.
	# Default: 30
	# Range: 1 ~ 365
	max_days = 30

#Auction browser interaction settings.
[ui]
	#If true, buying or cancelling a listing from the auction browser requires
	#clicking the same slot twice. The browser is a chest GUI where a single
	#misclick otherwise spends real currency instantly, and listings shift
	#position whenever the cache refreshes.
	#Set to false to restore the legacy one-click behaviour.
	buy_confirmation = true
	#How long an armed confirmation stays valid, in seconds.
	#After this delay the first click is forgotten and a fresh one is needed,
	#so a stale confirmation cannot be completed by an unrelated later click.
	# Default: 5
	# Range: 1 ~ 60
	confirm_timeout_seconds = 5

#Bidding rules.
[bidding]
	#Minimum raise over the current high bid, as a percentage of it (5 = 5%).
	#At least 1 unit is always required, so cheap listings still move.
	#Set to 0 for the legacy behaviour of a flat +1, which let a large
	#auction be won in one-coin steps.
	# Default: 5
	# Range: 0 ~ 100
	bid_increment_percent = 5
	#A bid placed within this many minutes of expiry pushes the deadline out
	#to this many minutes from now, so an auction only ends after a bid has
	#stood unchallenged for the full window.
	#Set to 0 to disable anti-sniping entirely.
	# Default: 5
	# Range: 0 ~ 120
	anti_snipe_window_minutes = 5
	#Hard ceiling on a listing's total lifetime, counted from when it was
	#listed. Bounds how far anti-sniping can push a deadline, so a bidding
	#war cannot keep an item pinned away from its seller indefinitely.
	#Should be greater than listings.listing_duration_hours.
	# Default: 72
	# Range: 1 ~ 720
	anti_snipe_max_total_hours = 72
	#If true, a bid may open BELOW the asking price, turning the bid layer
	#into a negotiation channel: the buyer proposes, the seller accepts early
	#with /arcadia_ah accept, and an offer the seller never answers is
	#refunded when the listing expires rather than forcing a sale below the
	#asking price.
	#If false, bidding starts at the asking price as it did before 1.4.0.
	offers_enabled = true
	#Lowest opening offer, as a percentage of the asking price (50 = half).
	#Stops 'offer' from becoming '1 coin on every listing'.
	#Ignored when offers_enabled is false.
	# Default: 50
	# Range: 1 ~ 100
	min_offer_percent = 50

#Item watches — notify a player when a matching listing appears.
[watchlist]
	#Master switch for /arcadia_ah watch and its notifications.
	enabled = true
	#Maximum item watches a single player may hold.
	#Bounds both the notification scan and the stored rows per player.
	# Default: 20
	# Range: 1 ~ 200
	max_entries_per_player = 20
	#Minimum seconds between two watch notifications sent to the same player.
	#Prevents a burst of listings of a popular item from flooding chat.
	# Default: 60
	# Range: 0 ~ 3600
	notify_cooldown_seconds = 60
	#If true, players get a short auction summary on login: pending mailbox
	#entries, coins waiting to be claimed, and listings expiring within a day.
	#Sent only when there is something to report.
	login_summary = true
