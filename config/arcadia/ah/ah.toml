#Auction House listing settings.
[listings]
	#How many hours a listing stays active before expiring and returning to the seller's mailbox.
	# Default: 48
	# Range: 1 ~ 336
	listing_duration_hours = 48
	#Maximum number of active listings a single player can have at once.
	# Default: 30
	# Range: 1 ~ 500
	max_listings_per_player = 30
	#Listing fee taken upfront from the seller's balance when creating a listing.
	#Expressed as a percentage of the listing price (10 = 10%).
	#Acts as a money sink and discourages spam listings.
	#Set to 0 to disable the fee entirely.
	# Default: 10
	# Range: 0 ~ 100
	listing_fee_percent = 10

#Item blacklist — items that cannot be listed on the AH.
#Use registry IDs (e.g. 'minecraft:bedrock', 'arcadia_pets:pet_item').
[blacklist]
	#List of item registry IDs that are blocked from being sold.
	items = ["minecraft:bedrock", "minecraft:command_block", "minecraft:barrier"]

#Featured listings — paid promotion that puts a listing at the top of search results.
[featured]
	#Extra fee, on top of the listing fee, taken upfront when a seller upgrades a listing to FEATURED.
	#Expressed as a percentage of the listing price (30 = 30%).
	#Set to 0 to make featuring free (not recommended).
	# Default: 30
	# Range: 0 ~ 500
	featured_fee_percent = 30
	#How many hours a listing remains FEATURED after upgrade (capped at the listing's own expiry).
	# Default: 24
	# Range: 1 ~ 336
	featured_duration_hours = 24

#Global chat broadcast on every new listing.
[broadcast]
	#If true, broadcast a chat message to all online players on every new listing.
	enabled = true
	#Minimum seconds between two broadcasts triggered by the same seller — anti-spam guard.
	# Default: 30
	# Range: 0 ~ 3600
	per_seller_cooldown_seconds = 30
	#Maximum length of a player's personalised broadcast template (characters).
	# Default: 128
	# Range: 16 ~ 512
	max_template_length = 128

#Server-side integrity checks before accepting a listing.
[integrity]
	#If true, every listed item must round-trip through the NBT serializer cleanly.
	#Fixes the cross-server SHULKER BOX BUG where contained items were lost when
	#the item was bought on a different server with a stricter NBT view.
	#Recommended: keep enabled. Disabling restores the legacy permissive behaviour.
	strict_nbt_validation = true

#Per-player sales history command (/arcadia_ah history).
[history]
	#Number of sales returned per page in /arcadia_ah history.
	# Default: 10
	# Range: 1 ~ 50
	page_size = 10
	#Look-back window for /arcadia_ah history, in days. Older sales are not shown.
	# Default: 30
	# Range: 1 ~ 365
	max_days = 30
